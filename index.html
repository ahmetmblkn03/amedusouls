<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amedusouls - 100% Completion Progress Routes</title>
    <meta name="description" content="A comprehensive 100% progress route checklist for Dark Souls 1, 2, 3 and Elden Ring with DLCs.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Amedusouls</h1>
                <p class="subtitle">The Ultimate Platinum Route</p>
            </div>
            
            <nav class="game-nav">
                <button class="nav-btn active" data-game="ds1">
                    <span class="game-icon">🔥</span> Dark Souls Remastered
                </button>
                <button class="nav-btn" data-game="ds2">
                    <span class="game-icon">👑</span> Dark Souls II: SotFS
                </button>
                <button class="nav-btn" data-game="ds3">
                    <span class="game-icon">⚔️</span> Dark Souls III
                </button>
                <button class="nav-btn" data-game="er">
                    <span class="game-icon">💍</span> Elden Ring + SotE
                </button>
            </nav>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="progress-title">Current Game Progress</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-titles">
                    <h2 id="current-game-title">Dark Souls Remastered</h2>
                    <p id="current-game-subtitle">100% Platinum Walkthrough Route</p>
                </div>
                <div class="header-actions">
                    <button id="collapse-all-btn" class="action-btn">Collapse All</button>
                    <button id="expand-all-btn" class="action-btn">Expand All</button>
                </div>
            </header>

            <div id="filter-panel" class="filter-panel"></div>

            <div id="checklist-container" class="checklist-container">
                <!-- Dynamic Content Injected Here -->
            </div>
        </main>
    </div>

    <!-- Data Files -->
    <script src="ds1.js"></script>
    <script src="ds2.js"></script>
    <script src="ds3.js"></script>
    <script src="er.js"></script>
    
    <!-- Main Application Logic -->
    <script src="app.js"></script>
</body>
</html>
